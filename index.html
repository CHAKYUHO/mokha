<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식재 전 꼭 읽어주세요! - 묘목 식재 및 관리 가이드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", Roboto, sans-serif;
      background-color: #f3f5f4;
      color: #222;
      line-height: 1.5;
      padding: 24px 12px;
    }
    .page-wrapper {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      padding: 16px;
    }
    .guide-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .caption {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="page-wrapper">
    <img
      src="guide.png"
      alt="묘목을 건강하게 키우기 위한 필수 안내 - 식재 전 꼭 읽어주세요!"
      class="guide-image"
    />
    <p class="caption">배송부터 식재, 관리까지 안내해 드리는 통합 가이드</p>
  </main>
</body>
</html>
